# Servidor .onion de teste do spike. Tor e eco WebSocket no mesmo namespace de rede, como o relay do
# SPEC; não é o relay. Endereço: docker compose exec tor cat /var/lib/tor/cifra-eco/hostname
services:
  tor:
    build:
      context: .
      dockerfile: tor.Dockerfile
    volumes:
      - onion:/var/lib/tor
    restart: unless-stopped

  eco:
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    network_mode: service:tor
    depends_on:
      - tor
    volumes:
      - ./eco.ts:/srv/eco.ts:ro
    environment:
      PORTA: '8080'
    command: ['node', '/srv/eco.ts']
    user: node
    read_only: true
    restart: unless-stopped

volumes:
  onion:
