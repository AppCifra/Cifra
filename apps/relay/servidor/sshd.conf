# SSH do servidor do relay: só chave, só o usuário cifra, sem root. Vai como
# /etc/ssh/sshd_config.d/00-cifra.conf: o sshd fica com o primeiro valor que lê de cada opção.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
AllowUsers cifra
# Só o encaminhamento local, que leva quem opera até o relay em 127.0.0.1:8080 (a sonda e os testes).
AllowTcpForwarding local
AllowStreamLocalForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
MaxAuthTries 3
LoginGraceTime 20
