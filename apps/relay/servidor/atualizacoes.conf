// Atualizações de segurança automáticas: as do Debian, que o unattended-upgrades já segue, e as do
// Docker. Quando uma pede reinício (o kernel, por exemplo), o servidor reinicia às 04:00 UTC, e os
// containers voltam sozinhos (`restart: unless-stopped`).
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
APT::Periodic::AutocleanInterval "7";
Unattended-Upgrade::Origins-Pattern {
  "origin=Docker,label=Docker CE,archive=${distro_codename}";
};
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "04:00";
