name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions travadas pelo commit, não pela tag: uma tag pode ser movida para outro código.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Instala o pnpm na versão do campo packageManager do package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Imagens do relay para amd64 e arm64, a do Raspberry Pi 4 (RNF-19). A sonda roda dentro da
  # própria imagem, contra o relay que ela sobe: no arm64, tudo sob emulação.
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        plataforma: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Emulação do arm64, com a imagem travada pelo digest (latest de 01/10/2026).
      - if: matrix.plataforma == 'linux/arm64'
        run: docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
      - run: docker build --platform ${{ matrix.plataforma }} -f apps/relay/Dockerfile -t cifra-relay .
      - run: docker build --platform ${{ matrix.plataforma }} -t cifra-relay-tor apps/relay/tor
      - name: sonda
        run: |
          docker run -d --platform ${{ matrix.plataforma }} --name relay cifra-relay
          for tentativa in $(seq 1 30); do
            if docker run --rm --platform ${{ matrix.plataforma }} --network container:relay \
              cifra-relay node apps/relay/scripts/sonda.ts ws://127.0.0.1:8080; then
              test -z "$(docker logs relay 2>&1)"
              exit 0
            fi
            sleep 2
          done
          exit 1
